<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GasGuard UI Review Board</title>
  <style>
    :root{--ink:#18202d;--muted:#566274;--line:#d9e0e8;--surface:#fff;--canvas:#f5f7fa;--accent:#ae302b;--focus:#164fc5;--pass:#12774c;--fix:#b84612;--more:#69511a}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 Inter,"Noto Sans Thai",system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:32px 24px 48px}.intro{display:flex;justify-content:space-between;gap:24px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:24px}.intro h1{margin:0;font-size:28px;letter-spacing:-.02em}.intro p{max-width:68ch;margin:7px 0 0;color:var(--muted)}.privacy{margin:0;padding:10px 12px;border:1px solid #b7cbe9;border-radius:9px;background:#edf5ff;color:#17447e;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0}.toolbar button,.viewer-actions button{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);color:var(--ink);font-weight:650}.toolbar button.primary{border-color:var(--accent);background:var(--accent);color:#fff}.toolbar button:focus-visible,.verdict input:focus-visible+span,.comment:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.count{margin-left:auto;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 2px 8px #1722350d}.preview{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;background:#e9edf2;border:0;border-bottom:1px solid var(--line);cursor:zoom-in}.details{padding:14px}.details h2{margin:0;font-size:17px}.meta,.point{margin:6px 0;color:var(--muted);font-size:13px}.point{min-height:38px}.verdict{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.verdict label{position:relative}.verdict input{position:absolute;opacity:0}.verdict span{display:block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.verdict input:checked+span{border-color:currentColor}.verdict label.pass{color:var(--pass)}.verdict label.fix{color:var(--fix)}.verdict label.more{color:var(--more)}.comment{display:block;min-height:82px;width:100%;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;color:var(--ink)}.card-actions{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.card-actions button{border:0;background:none;color:#144da1;padding:0;font-weight:700}.lightbox{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:#0a1426d9}.lightbox[hidden]{display:none}.lightbox figure{width:min(1200px,100%);max-height:calc(100vh - 48px);margin:0}.lightbox img{display:block;width:100%;max-height:calc(100vh - 112px);object-fit:contain;background:#fff}.lightbox figcaption{display:flex;justify-content:space-between;gap:12px;padding:10px 0;color:#fff}.lightbox button{min-height:38px;border:1px solid #ffffff80;border-radius:8px;padding:7px 10px;background:transparent;color:#fff;font-weight:700}.lightbox-controls{display:flex;gap:8px}.toast{position:fixed;right:20px;bottom:20px;padding:10px 13px;border-radius:8px;background:#18202d;color:#fff;box-shadow:0 8px 22px #17223538}@media(max-width:600px){.shell{padding:22px 14px 34px}.intro{display:block}.privacy{margin-top:14px}.count{width:100%;margin:0}.grid{grid-template-columns:1fr}.toolbar button{flex:1 1 auto}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="intro"><div><h1>GasGuard UI Review Board</h1><p>เลือกชุดภาพ Desktop เดิมหรือ Mobile Application UI แล้วบันทึกข้อเสนอแนะสำหรับรอบแก้ไขถัดไป</p></div><p class="privacy">Feedback เก็บเฉพาะใน browser เครื่องนี้</p></header>
    <div class="toolbar"><label>ชุดภาพ<select id="evidence-set"><option value="desktop">Desktop UI เดิม</option><option value="mobile">Mobile Application UI ใหม่</option></select></label><button type="button" id="copy-all" class="primary">Copy All Feedback</button><button type="button" id="export-feedback">Export JSON</button><button type="button" id="reset-feedback">Reset Feedback</button><span class="count" id="count">กำลังโหลดภาพ…</span></div>
    <section class="grid" id="cards" aria-live="polite"></section>
  </main>
  <dialog class="lightbox" id="lightbox" aria-label="ดูภาพขนาดใหญ่"><figure><img id="lightbox-image" alt=""><figcaption><span id="lightbox-caption"></span><span class="lightbox-controls"><button type="button" id="previous">ก่อนหน้า</button><button type="button" id="next">ถัดไป</button><button type="button" id="close">ปิด</button></span></figcaption></figure></dialog>
  <template id="card-template"><article class="card"><button class="preview-button" type="button"><img class="preview" alt=""></button><div class="details"><h2></h2><p class="meta"></p><p class="point"></p><div class="verdict" role="radiogroup" aria-label="ผลการตรวจ"><label class="pass"><input type="radio" value="ผ่าน"><span>ผ่าน</span></label><label class="fix"><input type="radio" value="ต้องแก้"><span>ต้องแก้</span></label><label class="more"><input type="radio" value="ขอเพิ่มข้อมูล"><span>ขอเพิ่มข้อมูล</span></label></div><label><span class="meta">Comment</span><textarea class="comment" placeholder="เขียนข้อสังเกตที่ตรวจพบ"></textarea></label><div class="card-actions"><button class="copy-one" type="button">Copy feedback</button><span class="meta">Simulation only</span></div></div></article></template>
  <script>
    (()=>{'use strict';const cards=document.querySelector('#cards'),template=document.querySelector('#card-template'),count=document.querySelector('#count'),box=document.querySelector('#lightbox'),image=document.querySelector('#lightbox-image'),caption=document.querySelector('#lightbox-caption'),setSelect=document.querySelector('#evidence-set');let manifest=[],current=0,setName='desktop';const key=()=>`gasguard-ui-review-feedback-v1:${setName}`,prefix=()=>setName==='mobile'?'mobile-app/':'';const read=()=>{try{return JSON.parse(localStorage.getItem(key())||'{}')}catch{return{}}};let feedback=read();const save=()=>localStorage.setItem(key(),JSON.stringify(feedback));const notify=t=>{const e=document.createElement('p');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1600)};const field=(item,name)=>item[name]||'—';const text=item=>`GasGuard UI Review\n\nSet: ${setName}\nImage: ${item.file}\nPage: ${field(item,'pageId')}/${field(item,'page')}\nRole: ${item.role}\nScenario: ${item.scenario}\nViewport: ${item.viewport}\nVerdict: ${feedback[item.file]?.verdict||'ยังไม่เลือก'}\nComment: ${feedback[item.file]?.comment||''}`;async function copy(value){try{await navigator.clipboard.writeText(value);notify('คัดลอกแล้ว')}catch{window.prompt('คัดลอกข้อความนี้',value)}}function render(){cards.innerHTML='';manifest.forEach((item,index)=>{const node=template.content.cloneNode(true),root=node.querySelector('.card'),img=node.querySelector('img'),data=feedback[item.file]||{};img.src=`${prefix()}screenshots/${item.file}`;img.alt=`${field(item,'pageId')}/${field(item,'page')}, ${item.role}, ${item.scenario}, ${item.viewport}`;img.addEventListener('error',()=>{root.dataset.broken='true';img.alt=`ไม่พบไฟล์ ${item.file}`});node.querySelector('h2').textContent=item.file;node.querySelector('.meta').textContent=`${field(item,'pageId')}/${field(item,'page')} · ${item.role} · ${item.scenario} · ${item.viewport}`;node.querySelector('.point').textContent=item.reviewPoint;node.querySelectorAll('input').forEach(input=>{input.name=`${setName}-${item.file}`;input.checked=data.verdict===input.value;input.addEventListener('change',()=>{feedback[item.file]={...feedback[item.file],verdict:input.value};save();updateCount()})});const area=node.querySelector('textarea');area.value=data.comment||'';area.addEventListener('input',()=>{feedback[item.file]={...feedback[item.file],comment:area.value};save();updateCount()});node.querySelector('.copy-one').addEventListener('click',()=>copy(text(item)));node.querySelector('.preview-button').addEventListener('click',()=>open(index));cards.append(node)});updateCount()}function updateCount(){const reviewed=manifest.filter(item=>feedback[item.file]?.verdict||feedback[item.file]?.comment).length;count.textContent=`${reviewed} / ${manifest.length} ภาพมี feedback`}function open(index){current=index;const item=manifest[current];image.src=`${prefix()}screenshots/${item.file}`;image.alt=item.file;caption.textContent=`${item.file} · ${field(item,'pageId')}/${field(item,'page')} · ${item.role} · ${item.scenario} · ${item.viewport}`;box.showModal()}function move(step){open((current+step+manifest.length)%manifest.length)}async function loadSet(){setName=setSelect.value;feedback=read();try{const response=await fetch(setName==='mobile'?'mobile-app/capture-manifest.json':'capture-manifest.json');if(!response.ok)throw new Error();manifest=await response.json();render()}catch{count.textContent='ไม่พบ capture manifest'}}document.querySelector('#previous').addEventListener('click',()=>move(-1));document.querySelector('#next').addEventListener('click',()=>move(1));document.querySelector('#close').addEventListener('click',()=>box.close());document.addEventListener('keydown',event=>{if(!box.open)return;if(event.key==='ArrowLeft')move(-1);if(event.key==='ArrowRight')move(1);if(event.key==='Escape')box.close()});setSelect.addEventListener('change',loadSet);document.querySelector('#copy-all').addEventListener('click',()=>{const values=manifest.filter(item=>feedback[item.file]?.comment||feedback[item.file]?.verdict&&feedback[item.file]?.verdict!=='ผ่าน').map(text);copy(values.join('\n\n')||'GasGuard UI Review\n\nยังไม่มี feedback ที่ต้องส่งต่อ')});document.querySelector('#export-feedback').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),set:setName,feedback},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`gasguard-ui-review-feedback-${setName}.json`;a.click();URL.revokeObjectURL(url)});document.querySelector('#reset-feedback').addEventListener('click',()=>{if(!window.confirm('ลบเฉพาะ Feedback ของ Review Board ชุดนี้ใน browser นี้หรือไม่?'))return;localStorage.removeItem(key());feedback={};render();notify('ล้าง Feedback แล้ว')});loadSet();})();
  </script>
</body>
</html>
